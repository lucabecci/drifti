name: Demo capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-evidence:
    name: Linux CLI evidence (Remotion / web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Capture transcripts
        run: |
          chmod +x scripts/demo-capture-linux.sh
          scripts/demo-capture-linux.sh "${{ runner.temp }}/demo-captures"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drifti-demo-captures
          path: ${{ runner.temp }}/demo-captures/
          retention-days: 30
          if-no-files-found: error

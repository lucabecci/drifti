name: Demo capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-transcripts:
    name: Real CLI transcripts (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run capture script
        run: |
          chmod +x scripts/demo-capture-linux.sh
          scripts/demo-capture-linux.sh "${{ runner.temp }}/demo-captures"

      - name: Upload captures
        uses: actions/upload-artifact@4.6.0
        with:
          name: drifti-demo-captures
          path: ${{ runner.temp }}/demo-captures/
          if-no-files-found: error

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build and publish Linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.84.0

      - name: Build drifti CLI
        run: cargo build --release -p drifti-cli --locked

      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          target="x86_64-unknown-linux-gnu"
          artifact="drifti-${version}-${target}"
          install -d "dist/${artifact}"
          install -m 755 target/release/drifti "dist/${artifact}/drifti"
          install -m 644 README.md "dist/${artifact}/"
          install -m 644 docs/linux/README.md "dist/${artifact}/LINUX.md"
          tar -czf "${artifact}.tar.gz" -C dist "${artifact}"
          sha256sum "${artifact}.tar.gz" > SHA256SUMS

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            drifti-*-x86_64-unknown-linux-gnu.tar.gz
            SHA256SUMS
          body_path: docs/launch/v0.1/github-release-notes.md
          draft: false
          prerelease: true

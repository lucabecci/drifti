[package]
name = "drifti-cli"
version = "0.1.0"
description = "CLI parsing and orchestration for Drifti"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "drifti"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.40", features = ["derive", "env"] }
drifti-observer = { path = "../drifti-observer" }
drifti-store = { path = "../drifti-store" }

[target.'cfg(target_os = "linux")'.dependencies]
drifti-observer-linux = { path = "../drifti-observer-linux" }

[lints]
workspace = true

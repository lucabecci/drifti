[package]
name = "drifti-cli"
version = "0.1.0"
description = "CLI parsing and orchestration for Drifti"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "drifti"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.40", features = ["derive", "env"] }
drifti-core = { path = "../drifti-core" }
drifti-observer = { path = "../drifti-observer" }
drifti-observer-linux = { path = "../drifti-observer-linux" }
drifti-store = { path = "../drifti-store" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"

[dev-dependencies]
tempfile = "=3.16.0"

[lints]
workspace = true
